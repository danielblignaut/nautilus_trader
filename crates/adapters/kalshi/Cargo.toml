[package]
name = "nautilus-kalshi"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Kalshi execution adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "nautilus_kalshi"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
high-precision = ["nautilus-model/high-precision"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-execution = { workspace = true }
nautilus-model = { workspace = true }
nautilus-system = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
ustr = { workspace = true }
indexmap = { workspace = true }
futures-util = { workspace = true }
url = { workspace = true }

# RSA-PSS signing for Kalshi API authentication
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = { version = "0.10", features = ["pem"] }
base64 = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
